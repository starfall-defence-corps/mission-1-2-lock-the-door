name: ARIA Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  aria-review:
    name: ARIA — Mission 1.2 Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout mission repo
        uses: actions/checkout@v4

      - name: Run ARIA review
        id: aria
        uses: starfall-defence-corps/aria@main
        with:
          mission: "1-2"
          mission-root: ${{ github.workspace }}
          output-file: aria-output.txt
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          skip-tests: "true"

      - name: Post ARIA review as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('aria-output.txt', 'utf8');
            } catch {
              output = fs.readFileSync('aria-console.txt', 'utf8');
            }
            const exitCode = '${{ steps.aria.outputs.exit-code }}';
            // A keyless run verifies nothing (tests skipped in CI, no LLM
            // review) — headline must stay neutral, not claim COMPLETE.
            const skipped = output.includes('SKIPPED — no ANTHROPIC_API_KEY');
            const status = skipped ? 'REVIEW SKIPPED — no API key configured'
              : exitCode === '0' ? 'COMPLETE' : 'INCOMPLETE';
            const icon = skipped ? ':information_source:'
              : exitCode === '0' ? ':white_check_mark:' : ':x:';
            const marker = 'ARIA — Mission 1-2 Review';

            // Render the qualitative review as markdown in the comment body;
            // only the console portion stays inside the code fence (#127).
            const splitAt = output.indexOf('## ARIA QUALITATIVE REVIEW');
            const consoleOut = splitAt === -1 ? output : output.slice(0, splitAt).trimEnd();
            const reviewMd = splitAt === -1 ? '' : output.slice(splitAt);

            const body = `## ${icon} ${marker} (${status})

            ${reviewMd}

            <details>
            <summary>Console output</summary>

            \`\`\`
            ${consoleOut}
            \`\`\`

            </details>

            ---
            *ARIA — Automated Review & Intelligence Analyst*
            *Starfall Defence Corps Academy*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const ariaComment = comments.find(c => c.body.includes(marker));

            if (ariaComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ariaComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
