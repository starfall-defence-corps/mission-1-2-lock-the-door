---
# Fleet Inventory — Starfall Defence Corps
# Pre-configured from Mission 1.1 Fleet Census.
# All 3 fleet nodes are registered and reachable.
# The SSH key path comes from ansible.cfg (present in both the project
# root and workspace/), so commands work from either directory.

all:
  children:
    web_servers:
      hosts:
        sdc-web:
          ansible_host: localhost
          ansible_port: 2221
          ansible_user: cadet
    db_servers:
      hosts:
        sdc-db:
          ansible_host: localhost
          ansible_port: 2222
          ansible_user: cadet
    comms_relays:
      hosts:
        sdc-comms:
          ansible_host: localhost
          ansible_port: 2223
          ansible_user: cadet
