# Repo-root Ansible config — mirrors workspace/ansible.cfg so ad-hoc ansible
# commands work from the repo root as well as from workspace/ (#115).
# Paths are relative to this file's directory.

[defaults]
inventory = workspace/inventory/hosts.yml
host_key_checking = False
remote_user = cadet
private_key_file = workspace/.ssh/cadet_key
deprecation_warnings = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o UserKnownHostsFile=/dev/null
